# Single source of truth for every notebook. Change a line here, rerun.
project_name: synthdetect
seed: 42

# Google Drive (mounted in Colab). Images and models live here, never in Git.
drive_root: /content/drive/MyDrive/synthdetect

domain: TBD            # open question (PRD section 14)
object_classes: []     # filled from objects_table.csv once the domain is chosen

generation:
  model: stable-diffusion-v1-5/stable-diffusion-inpainting   # open question
  image_size: 512
  methods: [add_objects, capture_conditions]
  conditions: [dark, side_light, glare, blur, noise, background]
  images_per_class: 100

detection:
  models:              # open question; at least one Transformer-based
    - PekingU/rtdetr_r50vd
  batch_size: 4

split: {tune: 0.6, val: 0.2, test: 0.2}
small_object_px: 32    # COCO definition of a small object
